plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

tasks.register('verifyTrackingValidation', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.infernalstudios.questlog.TrackingValidationVerification'
    systemProperty 'questlog.examples', rootProject.file('examples/tracking-validation').absolutePath
    workingDir = layout.buildDirectory.dir('verification').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn 'verifyTrackingValidation' }

tasks.register('verifyInlineLanguages', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.infernalstudios.questlog.InlineLanguagesVerification'
    workingDir = layout.buildDirectory.dir('verification').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn 'verifyInlineLanguages' }

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    // Optional recipe viewers; neither API is bundled with Questlog.
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}:api"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    // Cloth Config
    compileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"

    // Triggers
    compileOnly "maven.modrinth:triggers:${triggers_version}-neoforge"

    implementation 'net.jodah:typetools:0.6.3'
    compileOnly 'org.jetbrains:annotations:26.0.2-1'
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.6'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

sourceSets.main.resources.srcDir 'src/main/generated'

// Exercise verification mains against mapped Minecraft classes without launching a game.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
tasks.register('verifyRecipeLinks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.infernalstudios.questlog.RecipeLinksVerification'
    workingDir = layout.buildDirectory.dir('verification').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn 'verifyRecipeLinks' }
tasks.named('test') { failOnNoDiscoveredTests = false }

