configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile

    sourceSets.main.resources.sourceDirectories.each { dir ->
        commonResources dir
    }
}
tasks.register('verifyImageTooltips', JavaExec) {
